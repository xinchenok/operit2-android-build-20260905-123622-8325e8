name: Build enhanced Android
on:
  workflow_dispatch:
  push:
    branches: [enhancement/two-build-channels]
    paths:
      - '.github/workflows/enhanced-android.yml'
      - '.github/workflows/update-android.yml'
      - 'ci/enhanced-build-request.txt'
run-name: Build enhanced Android ${{ github.run_number }}
permissions:
  contents: write
  actions: read
jobs:
  enhanced:
    uses: ./.github/workflows/update-android.yml
    with:
      channel: enhanced
    secrets:
      OPERIT2_UPDATE_SIGNING: ${{ secrets.OPERIT2_UPDATE_SIGNING }}
