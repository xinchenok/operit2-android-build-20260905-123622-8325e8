# Historical entry retained only to direct existing bookmarks to the current build.
name: Legacy build retired - use Build latest Android
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  use-current-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Open the current fixed-signature build
        run: |
          echo 'This old pinned-source / temporary-signature workflow no longer builds APKs.'
          echo '## Use Build latest Android' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open the current build, then click Run workflow](https://github.com/xinchenok/operit2-android-build-20260905-123622-8325e8/actions/workflows/update-android.yml)' >> "$GITHUB_STEP_SUMMARY"
          echo 'All compilation happens on GitHub. The fixed signing Secret is configured once; no desktop launcher is required.' >> "$GITHUB_STEP_SUMMARY"
