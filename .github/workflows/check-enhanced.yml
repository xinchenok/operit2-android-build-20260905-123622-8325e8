name: Check enhanced changes (no Android build)
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enhanced-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      flutter: ${{ steps.source.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: wrapper
          persist-credentials: false
      - name: Archive exact builder snapshot
        run: git -C wrapper archive --format=zip --output="$RUNNER_TEMP/wrapper-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: enhanced-wrapper-source
          path: ${{ runner.temp }}/wrapper-source.zip
          retention-days: 7
      - uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit2
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit
          ref: main
          path: legacy
          persist-credentials: false
          sparse-checkout: |
            app/src/main/assets/packages
            examples
            tools/example_packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the isolated TypeScript compiler for source tests
        run: npm install --global typescript@5.9.3
      - name: Resolve test source versions
        id: source
        run: |
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(python3 -c 'import json; print(json.load(open("upstream/apps/flutter/app/.fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - name: Unit tests and real source / legacy archive checks
        run: |
          python3 -m unittest discover -s wrapper/builder -p 'test_*.py' -v
          python3 wrapper/ci/check_enhanced_sources.py upstream legacy
      - name: Save actual patch and compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-source-validation
          path: upstream/tools/release/dist/compatibility
          retention-days: 7
  flutter:
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      OPERIT2_CHANNEL: enhanced
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AAswordman/Operit2
          ref: ${{ needs.inspect.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .operit2-builder
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.inspect.outputs.flutter }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned FVM command for the real Web prerequisite
        run: |
          dart pub global activate fvm 4.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            target/operit-build-tools
            .ci-tools
            apps/flutter/native/operit-flutter-bridge/target
            apps/web_access/build
          key: enhanced-check-linux-${{ needs.inspect.outputs.source_sha }}-v2-${{ github.run_id }}
          restore-keys: |
            enhanced-check-linux-${{ needs.inspect.outputs.source_sha }}-
      - name: Type-check patched sources and run Flutter regression tests
        run: |
          set -o pipefail
          python3 -u .operit2-builder/ci/check_flutter_enhanced.py 2>&1 | tee "$RUNNER_TEMP/flutter-regressions.log"
      - name: Preserve patched inputs and regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-regression-diagnostics
          path: |
            ${{ runner.temp }}/flutter-regressions.log
            ${{ github.workspace }}/apps/flutter/app/test/enhanced*.dart
            ${{ github.workspace }}/apps/flutter/app/lib/ui/features/chat/screens/AIChatScreen.dart
            ${{ github.workspace }}/apps/flutter/app/lib/ui/features/chat/components/ChatArea.dart
            ${{ github.workspace }}/apps/flutter/app/lib/ui/features/chat/viewmodel/ChatViewModel.dart
            ${{ github.workspace }}/tools/release/dist/compatibility
          if-no-files-found: warn
          retention-days: 7
      - name: Keep code generation after test failures
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            target/operit-build-tools
            .ci-tools
            apps/flutter/native/operit-flutter-bridge/target
            apps/web_access/build
          key: enhanced-check-linux-${{ needs.inspect.outputs.source_sha }}-v2-${{ github.run_id }}
