name: Update Android from latest upstream
'on':
  workflow_dispatch:
    inputs:
      request_id:
        description: Request identifier (the launcher fills this automatically)
        type: string
        required: false
        default: web
run-name: Update Android ${{ inputs.request_id }}
permissions:
  contents: read
concurrency:
  group: operit2-update-channel
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      flutter_version: ${{ steps.resolve.outputs.flutter_version }}
      toolchain: ${{ steps.resolve.outputs.toolchain }}
      tool_key: ${{ steps.resolve.outputs.tool_key }}
      runtime_key: ${{ steps.resolve.outputs.runtime_key }}
      certificate_sha256: ${{ steps.resolve.outputs.certificate_sha256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Validate update scripts
      run: |
        python3 -m compileall -q builder
        python3 -m unittest discover -s builder -p 'test_*.py' -v
    - name: Resolve latest upstream once; check signing and existing release
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        OPERIT2_UPDATE_SIGNING: ${{ secrets.OPERIT2_UPDATE_SIGNING }}
      run: python3 builder/update_channel.py resolve
  runtime:
    needs: [resolve]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
    - name: Checkout pinned upstream source
      uses: actions/checkout@v4
      with:
        repository: AAswordman/Operit2
        ref: ${{ needs.resolve.outputs.source_sha }}
        persist-credentials: false
    - name: Restore pinned ARM64 runtime cache
      id: runtime_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a
          apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a
        key: operit2-runtime-arm64-${{ needs.resolve.outputs.runtime_key }}-update-v1
    - name: Reuse previously built runtime from the same pinned source
      id: reuse_runtime
      if: steps.runtime_cache.outputs.cache-hit != 'true' && needs.resolve.outputs.source_sha == '303192ccf12a8873d9d391228be026096de95db5'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: operit2-runtime-arm64
        path: apps/flutter/app/android/app/src/main
        run-id: '33945019027'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install runtime build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison build-essential bzip2 ca-certificates curl diffutils flex gawk gzip patch pkg-config tar unzip xz-utils
      if: steps.runtime_cache.outputs.cache-hit != 'true' && steps.reuse_runtime.outcome != 'success'
    - name: Fetch runtime sources
      shell: pwsh
      run: |
        # Transport retries only; the pinned upstream script checks the archive hashes.
        function Invoke-WebRequest {
          param([string]$Uri, [string]$OutFile)
          $PSNativeCommandUseErrorActionPreference = $false
          $urls = @($Uri)
          if ($Uri -eq 'https://ftp.gnu.org/gnu/bash/bash-5.2.37.tar.gz') {
            $urls += 'https://ftp.wayne.edu/gnu/bash/bash-5.2.37.tar.gz'
            $urls += 'https://ftpmirror.gnu.org/bash/bash-5.2.37.tar.gz'
          }
          foreach ($url in $urls) {
            Write-Host "Fetching with IPv4 and bounded retries: $url"
            & curl --ipv4 --fail --location --show-error --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 120 --output "$OutFile.partial" $url
            if ($LASTEXITCODE -eq 0) {
              Move-Item -LiteralPath "$OutFile.partial" -Destination $OutFile -Force
              return
            }
            Remove-Item -LiteralPath "$OutFile.partial" -Force -ErrorAction SilentlyContinue
          }
          throw "All source download attempts failed: $Uri"
        }
        . ./tools/android-runtime/fetch_sources.ps1
        if ($LASTEXITCODE -ne 0) { throw 'Runtime source extraction failed' }
      if: steps.runtime_cache.outputs.cache-hit != 'true' && steps.reuse_runtime.outcome != 'success'
    - name: Fetch Android NDK
      run: bash tools/android-runtime/fetch_ndk_wsl.sh
      if: steps.runtime_cache.outputs.cache-hit != 'true' && steps.reuse_runtime.outcome != 'success'
    - name: Build upstream terminal runtime
      run: |
        export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
        bash tools/android-runtime/build_android_tools_wsl.sh
        bash tools/android-runtime/build_alpine_rootfs_wsl.sh
      if: steps.runtime_cache.outputs.cache-hit != 'true' && steps.reuse_runtime.outcome != 'success'
    - name: Check runtime payload before reuse and caching
      shell: bash
      run: |
        set -euo pipefail
        root=apps/flutter/app/android/app/src/main
        for lib in libbash.so liboperit_busybox.so liboperit_loader.so liboperit_proot.so; do
          test -s "$root/jniLibs/arm64-v8a/$lib"
        done
        test -s "$root/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin"
        test -s "$root/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256"
    - name: Save runtime independently of APK build success
      if: steps.runtime_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a
          apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a
        key: operit2-runtime-arm64-${{ needs.resolve.outputs.runtime_key }}-update-v1
    - name: Transfer ARM64 runtime to Windows job
      uses: actions/upload-artifact@v4
      with:
        name: operit2-runtime-arm64
        path: |
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
          apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
          apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
          apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
        if-no-files-found: error
        retention-days: 14
  apk:
    needs: [resolve, runtime]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: D:\o
    env:
      RUSTFLAGS: -Awarnings
      CARGO_BUILD_JOBS: '3'
      RUST_TOOLCHAIN_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).RUST_TOOLCHAIN_VERSION }}
      FVM_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).FVM_VERSION }}
      TYPESCRIPT_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).TYPESCRIPT_VERSION }}
      WASM_BINDGEN_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).WASM_BINDGEN_VERSION }}
      WASI_SDK_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).WASI_SDK_VERSION }}
      QUICKJS_WASM_SYS_WASI_SDK_MAJOR_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).QUICKJS_WASM_SYS_WASI_SDK_MAJOR_VERSION }}
      QUICKJS_WASM_SYS_WASI_SDK_MINOR_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).QUICKJS_WASM_SYS_WASI_SDK_MINOR_VERSION }}
      FVM_CACHE_PATH: D:\fvm
      GRADLE_USER_HOME: D:\g
      TERSER_VERSION: ${{ fromJSON(needs.resolve.outputs.toolchain).TERSER_VERSION }}
      PYTHONUNBUFFERED: '1'
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      OPERIT2_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
      FLUTTER_VERSION: ${{ needs.resolve.outputs.flutter_version }}
    steps:
    - name: Enable symlink checkout required by upstream web assets
      run: git config --global core.symlinks true
      working-directory: ${{ github.workspace }}
    - name: Checkout pinned upstream source
      uses: actions/checkout@v4
      with:
        repository: AAswordman/Operit2
        ref: ${{ needs.resolve.outputs.source_sha }}
        persist-credentials: false
    - name: Checkout build wrapper
      uses: actions/checkout@v4
      with:
        path: .operit2-builder
        persist-credentials: false
    - name: Stage source at short Windows build root
      working-directory: ${{ github.workspace }}
      id: stage
      run: |
        $root = 'D:\o'
        if (Test-Path -LiteralPath $root) { throw "Build root already exists: $root" }
        git clone --local --no-hardlinks -- "$env:GITHUB_WORKSPACE" $root
        if ($LASTEXITCODE -ne 0) { throw 'Unable to create short-path source clone' }
        Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.operit2-builder') -Destination (Join-Path $root '.operit2-builder') -Recurse
        $head = (git -C $root rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Unexpected source commit' }
        New-Item -ItemType Directory -Force (Join-Path $root '.ci-logs') | Out-Null
        Write-Host "Compilation root: $root; source: $head"
    - name: Download runtime
      uses: actions/download-artifact@v4
      with:
        name: operit2-runtime-arm64
        path: D:/o/apps/flutter/app/android/app/src/main
    - name: Restore dependency and Rust compilation checkpoints
      id: build_cache
      uses: actions/cache/restore@v5
      with:
        path: |
          C:/Users/runneradmin/AppData/Local/Pub/Cache
          C:/Users/runneradmin/.cargo/registry
          C:/Users/runneradmin/.cargo/git
          D:/g/caches
          D:/g/wrapper
          D:/o/.ci-tools/typescript
          D:/o/.ci-tools/terser
          D:/o/.ci-tools/wasm-bindgen
          D:/o/target
          D:/o/core/target
          D:/o/apps/flutter/native/operit-flutter-bridge/target
          D:/o/apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart
          D:/o/apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart
        key: operit2-update-win-${{ needs.resolve.outputs.source_sha }}-${{ needs.resolve.outputs.tool_key }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: operit2-update-win-${{ needs.resolve.outputs.source_sha }}-${{ needs.resolve.outputs.tool_key }}-v1-
    - name: Install bootstrap Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ needs.resolve.outputs.flutter_version }}
        channel: stable
        cache: true
        pub-cache: false
      id: bootstrap
    - name: Save bootstrap SDK immediately
      if: steps.bootstrap.outputs.CACHE-HIT != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.bootstrap.outputs.CACHE-PATH }}
        key: ${{ steps.bootstrap.outputs.CACHE-KEY }}
    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run orchestration tests on Windows too
      run: python -m unittest discover -s .operit2-builder/builder -p 'test_*.py' -v
    - name: Prepare Python and FVM
      run: |
        python -m venv .venv
        if ($LASTEXITCODE -ne 0) { throw 'Python venv creation failed' }
        dart pub global activate fvm $env:FVM_VERSION
        if ($LASTEXITCODE -ne 0) { throw 'FVM installation failed' }
        $pubCache = $env:PUB_CACHE
        if (-not $pubCache) { $pubCache = Join-Path $env:LOCALAPPDATA 'Pub/Cache' }
        (Join-Path $pubCache 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Restore pinned FVM SDK
      id: fvm_cache
      uses: actions/cache/restore@v5
      with:
        path: D:/fvm
        key: operit2-update-fvm-${{ needs.resolve.outputs.tool_key }}-v1
    - name: Install project Flutter SDK
      working-directory: D:\o\apps\flutter\app
      run: fvm install --skip-pub-get
      id: fvm_install
    - name: Precache Android engine before expensive compilation
      id: precache
      working-directory: D:\o\apps\flutter\app
      run: |
        & .\.fvm\flutter_sdk\bin\flutter.bat precache --android --web
        if ($LASTEXITCODE -ne 0) { throw 'Android/Web engine precache failed at the short build path' }
    - name: Save pinned SDK independently of build result
      if: steps.fvm_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: D:/fvm
        key: operit2-update-fvm-${{ needs.resolve.outputs.tool_key }}-v1
    - name: Install Rust targets
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
        targets: aarch64-linux-android,wasm32-unknown-unknown
    - name: Install upstream-required libclang
      run: |
        $version = '21.1.8'
        $name = "libclang.runtime.win-x64.$version"
        $dir = Join-Path 'target/operit-build-tools' $name
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $archive = Join-Path 'target/operit-build-tools' "$name.zip"
        Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
        if (-not (Test-Path (Join-Path $dir 'runtimes/win-x64/native/libclang.dll'))) {
          throw 'libclang.dll was not extracted'
        }
    - name: Restore fixed update signing key
      env:
        OPERIT2_UPDATE_SIGNING: ${{ secrets.OPERIT2_UPDATE_SIGNING }}
      run: '& .\.operit2-builder\builder\restore_update_signing.ps1'
    - name: Check upstream build environment
      run: python tools/build_scripts/check_environment.py --products app --github-runner
    - name: Execute actual Gradle plugin packing and native prerequisites
      id: preflight
      run: |
        New-Item -ItemType Directory -Force .ci-logs | Out-Null
        python -u .operit2-builder/builder/build_driver.py preflight 2>&1 | Tee-Object -FilePath .ci-logs/preflight.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Restore exact Web Access checkpoint
      id: web_cache
      uses: actions/cache/restore@v5
      with:
        path: |
          D:/o/apps/web_access/build/bundle
          D:/o/apps/web_access/build/ci-provenance.json
        key: operit2-update-web-${{ needs.resolve.outputs.source_sha }}-${{ needs.resolve.outputs.tool_key }}-sync-v1
    - name: Build or reuse verified Web Access checkpoint
      run: |
        New-Item -ItemType Directory -Force .ci-logs | Out-Null
        python -u .operit2-builder/builder/build_driver.py web 2>&1 | Tee-Object -FilePath .ci-logs/web.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      id: web
    - name: Save completed Web checkpoint before APK build
      if: steps.web_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          D:/o/apps/web_access/build/bundle
          D:/o/apps/web_access/build/ci-provenance.json
        key: operit2-update-web-${{ needs.resolve.outputs.source_sha }}-${{ needs.resolve.outputs.tool_key }}-sync-v1
    - name: Archive reusable Web checkpoint independently
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: operit2-web-checkpoint
        include-hidden-files: true
        path: |
          D:/o/apps/web_access/build/bundle
          D:/o/apps/web_access/build/ci-provenance.json
        if-no-files-found: error
        retention-days: 14
    - name: Build ARM64 APK
      run: |
        New-Item -ItemType Directory -Force .ci-logs | Out-Null
        python -u .operit2-builder/builder/build_driver.py apk 2>&1 | Tee-Object -FilePath .ci-logs/apk.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      id: build_apk
    - name: Verify APK payload and SHA-256
      run: python .operit2-builder/builder/verify_apk.py tools/release/dist/operit2-android-arm64-personal-test.apk
    - name: Verify Android signature
      run: |
        $sdk = $env:ANDROID_HOME
        if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
        if (-not $sdk) { throw 'Android SDK directory is not available' }
        $signer = Get-ChildItem (Join-Path $sdk 'build-tools') -Recurse -Filter apksigner.bat | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signer) { throw 'Android apksigner is not available' }
        & $signer.FullName verify --verbose --print-certs tools/release/dist/operit2-android-arm64-personal-test.apk 2>&1 | Tee-Object -FilePath tools/release/dist/signature.txt
        if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
        $aapt = Join-Path $signer.DirectoryName 'aapt2.exe'
        $badging = & $aapt dump badging tools/release/dist/operit2-android-arm64-personal-test.apk 2>&1
        if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect APK version and package ID' }
        $text = $badging -join "`n"
        $packageMatch = [regex]::Match($text, "package: name='app.operit' versionCode='([0-9]+)'")
        if (-not $packageMatch.Success) { throw 'Unexpected Android package identity' }
        if ($packageMatch.Groups[1].Value -ne $env:OPERIT2_BUILD_NUMBER) { throw 'APK versionCode did not increase as requested' }
    - name: Archive matching upstream source
      run: |
        git archive --format=zip --output=tools/release/dist/Operit2-source.zip HEAD
        if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
        git -C .operit2-builder archive --format=zip --output=D:/o/tools/release/dist/Operit2-builder.zip HEAD
        if ($LASTEXITCODE -ne 0) { throw "Builder archive failed" }
    - name: Archive dependency patch and build information
      run: |
        Compress-Archive -Path tools/release/dist/compatibility,tools/release/dist/build-workflow.yml,tools/release/dist/build_arm64.py,tools/release/dist/build_driver.py,tools/release/dist/verify_apk.py -DestinationPath tools/release/dist/Operit2-build-info.zip -Force
    - name: Upload installable APK and build information
      uses: actions/upload-artifact@v4
      with:
        name: operit2-android-apk
        path: |
          D:/o/tools/release/dist/operit2-android-arm64-personal-test.apk
          D:/o/tools/release/dist/BUILD-INFO.json
          D:/o/tools/release/dist/SHA256SUMS
          D:/o/tools/release/dist/signature.txt
          D:/o/tools/release/dist/build-workflow.yml
          D:/o/tools/release/dist/build_arm64.py
          D:/o/tools/release/dist/verify_apk.py
          D:/o/tools/release/dist/UPSTREAM-LICENSE
          D:/o/tools/release/dist/compatibility/
          D:/o/tools/release/dist/build_driver.py
          D:/o/tools/release/dist/Operit2-build-info.zip
          D:/o/tools/release/dist/resolved-pubspec.lock
          D:/o/tools/release/dist/resolved-pubspec.yaml
        if-no-files-found: error
        retention-days: 14
    - name: Upload corresponding upstream source
      uses: actions/upload-artifact@v4
      with:
        name: operit2-source
        path: |
          D:/o/tools/release/dist/Operit2-source.zip
          D:/o/tools/release/dist/Operit2-builder.zip
        if-no-files-found: error
        retention-days: 14
    - name: Preserve diagnostic logs even on failure
      if: always() && steps.stage.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: operit2-diagnostics
        include-hidden-files: true
        path: |
          D:/o/.ci-logs/
          D:/o/tools/release/dist/compatibility/
        if-no-files-found: warn
        retention-days: 14
    - name: Stop Gradle before saving compiler caches
      if: always() && steps.preflight.outcome != 'skipped' && steps.preflight.outcome != ''
      continue-on-error: true
      run: |
        if (Test-Path -LiteralPath 'apps/flutter/app/android/gradlew.bat') {
          & .\apps\flutter\app\android\gradlew.bat --stop
        }
    - name: Save dependency and Rust progress even if APK fails
      if: always() && steps.precache.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          C:/Users/runneradmin/AppData/Local/Pub/Cache
          C:/Users/runneradmin/.cargo/registry
          C:/Users/runneradmin/.cargo/git
          D:/g/caches
          D:/g/wrapper
          D:/o/.ci-tools/typescript
          D:/o/.ci-tools/terser
          D:/o/.ci-tools/wasm-bindgen
          D:/o/target
          D:/o/core/target
          D:/o/apps/flutter/native/operit-flutter-bridge/target
          D:/o/apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart
          D:/o/apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart
        key: operit2-update-win-${{ needs.resolve.outputs.source_sha }}-${{ needs.resolve.outputs.tool_key }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: [resolve, apk]
    if: needs.resolve.outputs.should_build == 'true' && needs.apk.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
      CERTIFICATE_SHA256: ${{ needs.resolve.outputs.certificate_sha256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: operit2-android-apk
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: operit2-source
        path: dist
    - name: Publish verified fixed-signature APK and matching sources
      run: python3 builder/update_channel.py publish
